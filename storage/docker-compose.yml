version: '3.8'

services:
  storage-node-0:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage-node-0
    ports:
      - "50052:50051"
    environment:
      - NODE_ID=0
      - IS_PRIMARY=false
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
    volumes:
      - ./marketplace_items.jsonl:/app/data/marketplace_items.jsonl:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.insecure_channel('localhost:50051')"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 10s
    restart: unless-stopped
    networks:
      - marketplace-network

  storage-node-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage-node-1
    ports:
      - "50053:50051"
    environment:
      - NODE_ID=1
      - IS_PRIMARY=false
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
    volumes:
      - ./marketplace_items.jsonl:/app/data/marketplace_items.jsonl:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.insecure_channel('localhost:50051')"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 10s
    restart: unless-stopped
    networks:
      - marketplace-network

  storage-node-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: storage-node-2
    ports:
      - "50054:50051"
    environment:
      - NODE_ID=2
      - IS_PRIMARY=true
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
    volumes:
      - ./marketplace_items.jsonl:/app/data/marketplace_items.jsonl:ro
    depends_on:
      storage-node-0:
        condition: service_healthy
      storage-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.insecure_channel('localhost:50051')"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 10s
    restart: unless-stopped
    networks:
      - marketplace-network

networks:
  marketplace-network:
    driver: bridge
